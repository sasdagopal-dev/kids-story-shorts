name: Voice test (Hindi narration only)

on:
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Scene plan file"
        default: "scene_plan_2min.json"
      voice_gender:
        description: "Narrator voice"
        type: choice
        default: male
        options:
          - male
          - female
      tts_engine:
        description: "Voice engine (auto = Edge first, then Gemini if you added the key)"
        type: choice
        default: auto
        options:
          - auto
          - edge
          - gemini
      rate:
        description: "Speaking speed for the Edge voice (example: -8% slower, +0% normal)"
        default: "-8%"

jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Make the Hindi narration
        env:
          PLAN_FILE: ${{ inputs.plan_file }}
          GENDER: ${{ inputs.voice_gender }}
          ENGINE: ${{ inputs.tts_engine }}
          RATE: ${{ inputs.rate }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 tts.py --plan "$PLAN_FILE" --gender "$GENDER" --engine "$ENGINE" --rate "$RATE"

      - name: Show result summary
        if: always()
        run: |
          if [ -f tts_summary.md ]; then cat tts_summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-test-results
          path: |
            narration_preview.mp3
            tts_summary.md
            scene_plan_timed.json
            audio/
