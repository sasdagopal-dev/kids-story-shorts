name: Make full movie FAST (6 parallel jobs)

on:
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Scene plan file"
        default: "scene_plan_part1.json"
      voice_mode:
        description: "with_voice = Hindi narration + subtitles. silent_with_subtitles = no voice"
        type: choice
        default: with_voice
        options:
          - with_voice
          - silent_with_subtitles
      voice_gender:
        description: "Narrator voice (only used with_voice)"
        type: choice
        default: male
        options:
          - male
          - female
      tts_engine:
        description: "Voice engine (auto = Edge first, then Gemini if you added the key)"
        type: choice
        default: auto
        options:
          - auto
          - edge
          - gemini
      rate:
        description: "Speaking speed for the Edge voice (example: -8% slower, +0% normal)"
        default: "-8%"
      fps:
        description: "Frames per second to render"
        default: "12"
      quality:
        description: "balanced = good and fast. fast = quickest. high = best look, slowest"
        type: choice
        default: balanced
        options:
          - balanced
          - fast
          - high

jobs:
  # ------------------------------------------------------------ 1) the Hindi voice and timing
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts

      - name: Make the Hindi narration
        env:
          PLAN_FILE: ${{ inputs.plan_file }}
          GENDER: ${{ inputs.voice_gender }}
          ENGINE: ${{ inputs.tts_engine }}
          RATE: ${{ inputs.rate }}
          VOICE_MODE: ${{ inputs.voice_mode }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXTRA="--on-fail silent"
          if [ "$VOICE_MODE" = "silent_with_subtitles" ]; then EXTRA="--no-audio"; fi
          python3 tts.py --plan "$PLAN_FILE" --gender "$GENDER" --engine "$ENGINE" --rate="$RATE" $EXTRA

      - name: Save plan and audio
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            scene_plan_timed.json
            tts_summary.md
            narration_preview.mp3
            audio/
          if-no-files-found: warn

  # ------------------------------------------------------------ 2) six jobs render different shots at the same time
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the plan and audio
        uses: actions/download-artifact@v4
        with:
          name: plan

      - name: Download the asset packs we need from the Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p asset_zips assets
          gh release download assets --repo "$GITHUB_REPOSITORY" --dir asset_zips \
            --pattern "animals*" --pattern "modular-men*" --pattern "stylized-nature*" \
            || echo "Could not download the asset packs."
          for z in asset_zips/*.zip; do
            [ -f "$z" ] || continue
            d="assets/$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -q -o "$z" -d "$d"
            echo "Unpacked $z"
          done

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xz-utils unzip \
            libxi6 libxrender1 libxkbcommon0 libsm6 libxxf86vm1 \
            libxfixes3 libgl1 libegl1 libgl1-mesa-dri

      - name: Download Blender 3.6 LTS
        run: |
          mkdir -p "$HOME/blender"
          curl -L -o blender.tar.xz https://download.blender.org/release/Blender3.6/blender-3.6.5-linux-x64.tar.xz
          tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1
          "$HOME/blender/blender" -b --version

      - name: Render this part of the movie
        env:
          VID_FPS: ${{ inputs.fps }}
          QUALITY: ${{ inputs.quality }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p out
          xvfb-run -a "$HOME/blender/blender" -b --python-exit-code 1 \
            -P movie_render.py -- \
            --assets . --plan scene_plan_timed.json --fps "$VID_FPS" \
            --quality "$QUALITY" --shard "$SHARD" --shards 6 --out out

      - name: Pack this part into a small video file
        env:
          VID_FPS: ${{ inputs.fps }}
          SHARD: ${{ matrix.shard }}
        run: |
          ffmpeg -y -loglevel error -framerate "$VID_FPS" -i out/frame_%05d.png \
            -c:v libx264 -preset fast -crf 14 -pix_fmt yuv420p "out/segment_${SHARD}.mp4"
          cp out/summary.md "out/render_summary_${SHARD}.md"
          rm -f out/frame_*.png

      - name: Save this part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segment-${{ matrix.shard }}
          path: |
            out/segment_${{ matrix.shard }}.mp4
            out/render_summary_${{ matrix.shard }}.md

  # ------------------------------------------------------------ 3) join the parts, add voice, subtitles, music
  assemble:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the plan and audio
        uses: actions/download-artifact@v4
        with:
          name: plan

      - name: Get the 6 video parts
        uses: actions/download-artifact@v4
        with:
          pattern: segment-*
          merge-multiple: true
          path: segments

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          fc-cache -f
          echo "Devanagari fonts found:"
          fc-list | grep -i "devanagari" | head -3 || echo "NO Devanagari font found"

      - name: Join the parts and build the final video
        env:
          VID_FPS: ${{ inputs.fps }}
        run: |
          mkdir -p out
          : > list.txt
          for i in 0 1 2 3 4 5; do
            echo "file '$PWD/segments/segment_$i.mp4'" >> list.txt
          done
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy out/video_all.mp4
          MUSIC=""
          MUSIC_FILE=$(find music -type f -iname "music*.mp3" 2>/dev/null | head -1 || true)
          if [ -n "$MUSIC_FILE" ]; then MUSIC="$MUSIC_FILE"; echo "Using music: $MUSIC"; fi
          python3 assemble.py --plan scene_plan_timed.json --video out/video_all.mp4 \
            --fps "$VID_FPS" --out out/movie_final.mp4 --music "$MUSIC"
          rm -f out/video_all.mp4

      - name: Show result summary
        if: always()
        run: |
          if [ -f tts_summary.md ]; then cat tts_summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          for f in segments/render_summary_*.md; do
            [ -f "$f" ] || continue
            echo "### Part $(basename "$f" .md | sed 's/render_summary_//')" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Save the movie
        uses: actions/upload-artifact@v4
        with:
          name: movie-final
          path: |
            out/movie_final.mp4
            out/subs.ass
            tts_summary.md
            narration_preview.mp3
            scene_plan_timed.json
