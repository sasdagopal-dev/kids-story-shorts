name: Make episode v2

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Leave EMPTY to use today's topic from channel_v2.json"
        default: ""
      length:
        description: "Episode length in seconds. Use 60 for a quick first test."
        type: choice
        default: "150"
        options:
          - "60"
          - "90"
          - "150"
      quality:
        description: "high = best look. balanced = faster. fast = quickest (good for tests)."
        type: choice
        default: balanced
        options:
          - high
          - balanced
          - fast
      voice_gender:
        description: "Narrator voice"
        type: choice
        default: male
        options:
          - male
          - female
  # Later, to make one episode automatically every day, remove the # in front of the next 2 lines:
  # schedule:
  #   - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: episode-v2
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------ 1) story, safety check, voice
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Download the asset packs from the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source ./retry.sh
          mkdir -p asset_zips assets
          retry gh release download assets --repo "$GITHUB_REPOSITORY" --dir asset_zips --clobber \
            --pattern "animals*" --pattern "modular-men*" --pattern "stylized-nature*" --pattern "downtown-city*"
          for z in asset_zips/*.zip; do
            [ -f "$z" ] || continue
            d="assets/$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -q -o "$z" -d "$d"
          done

      - name: Install tools
        run: |
          source ./retry.sh
          retry sudo apt-get update
          retry sudo apt-get install -y ffmpeg unzip
          retry pip install --upgrade edge-tts

      - name: Write the episode with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          LENGTH: ${{ inputs.length || '150' }}
        run: |
          source ./retry.sh
          args=(--config channel_v2.json --assets assets --seconds "$LENGTH" --out scene_plan_auto.json \
                --report plan_report.md --meta video_meta.json)
          if [ -n "$TOPIC" ]; then args+=(--topic "$TOPIC"); fi
          retry python3 story_brain_v2.py "${args[@]}"

      - name: Make the narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GENDER: ${{ inputs.voice_gender || 'male' }}
        run: |
          source ./retry.sh
          retry python3 tts.py --plan scene_plan_auto.json --gender "$GENDER" --engine auto

      - name: Show the plan
        if: always()
        run: |
          if [ -f plan_report.md ]; then cat plan_report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f tts_summary.md ]; then cat tts_summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save plan and audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            scene_plan_timed.json
            scene_plan_auto.json
            plan_report.md
            video_meta.json
            tts_summary.md
            narration_preview.mp3
            audio/
          if-no-files-found: warn

  # ------------------------------------------------------------ 2) eight jobs render different shots at the same time
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the plan and audio
        uses: actions/download-artifact@v4
        with:
          name: plan

      - name: Download the asset packs from the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source ./retry.sh
          mkdir -p asset_zips assets
          retry gh release download assets --repo "$GITHUB_REPOSITORY" --dir asset_zips --clobber \
            --pattern "animals*" --pattern "modular-men*" --pattern "stylized-nature*" --pattern "downtown-city*"
          for z in asset_zips/*.zip; do
            [ -f "$z" ] || continue
            d="assets/$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -q -o "$z" -d "$d"
          done

      - name: Install system packages
        run: |
          source ./retry.sh
          retry sudo apt-get update
          retry sudo apt-get install -y xvfb ffmpeg xz-utils unzip \
            libxi6 libxrender1 libxkbcommon0 libsm6 libxxf86vm1 \
            libxfixes3 libgl1 libegl1 libgl1-mesa-dri

      - name: Remember Blender between runs
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-3.6.5-linux-x64

      - name: Get Blender 3.6 LTS (checks the file, tries several mirrors)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./get_blender_v2.sh

      - name: Render this part of the movie (tries up to 3 times)
        env:
          QUALITY: ${{ inputs.quality || 'balanced' }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p out
          ok=0
          for attempt in 1 2 3; do
            rm -f out/frame_*.png
            if xvfb-run -a "$HOME/blender/blender" -b --python-exit-code 1 \
                 -P movie_render.py -- \
                 --assets assets --plan scene_plan_timed.json --fps 12 \
                 --quality "$QUALITY" --shard "$SHARD" --shards 8 --out out; then
              ok=1
              break
            fi
            echo "Render attempt $attempt failed. Trying again in 20 seconds."
            sleep 20
          done
          [ "$ok" = 1 ] || exit 1

      - name: Pack this part into a small video file
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          if ls out/frame_*.png >/dev/null 2>&1; then
            ffmpeg -y -loglevel error -framerate 12 -i out/frame_%05d.png \
              -c:v libx264 -preset fast -crf 14 -pix_fmt yuv420p "out/segment_${SHARD}.mp4"
            rm -f out/frame_*.png
          else
            echo "This part had no shots."
          fi
          cp out/summary.md "out/render_summary_${SHARD}.md" || true

      - name: Save this part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segment-${{ matrix.shard }}
          path: |
            out/segment_${{ matrix.shard }}.mp4
            out/render_summary_${{ matrix.shard }}.md
          if-no-files-found: ignore

  # ------------------------------------------------------------ 3) join the parts, add voice, subtitles, cards
  assemble:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the plan and audio
        uses: actions/download-artifact@v4
        with:
          name: plan

      - name: Get the video parts
        uses: actions/download-artifact@v4
        with:
          pattern: segment-*
          merge-multiple: true
          path: segments

      - name: Install tools
        run: |
          source ./retry.sh
          retry sudo apt-get update
          retry sudo apt-get install -y ffmpeg fonts-noto-core
          fc-cache -f

      - name: Join the parts and build the final video
        run: |
          mkdir -p out
          : > list.txt
          for f in $(ls segments/segment_*.mp4 | sort -V); do
            echo "file '$PWD/$f'" >> list.txt
          done
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy out/video_all.mp4
          MUSIC=""
          MUSIC_FILE=$(find music -type f -iname "music*.mp3" 2>/dev/null | head -1 || true)
          if [ -n "$MUSIC_FILE" ]; then MUSIC="$MUSIC_FILE"; echo "Using music: $MUSIC"; fi
          python3 assemble.py --plan scene_plan_timed.json --video out/video_all.mp4 \
            --fps 12 --out out/movie_final.mp4 --music "$MUSIC"
          rm -f out/video_all.mp4

      - name: Show result summary
        if: always()
        run: |
          for f in segments/render_summary_*.md; do
            [ -f "$f" ] || continue
            echo "### Part $(basename "$f" .md | sed 's/render_summary_//')" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Save the episode (this is your video)
        uses: actions/upload-artifact@v4
        with:
          name: episode-v2-final
          retention-days: 14
          path: |
            out/movie_final.mp4
            video_meta.json
            plan_report.md
            tts_summary.md
            out/subs.ass
