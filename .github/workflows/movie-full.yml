name: Make full movie (voice + video + subtitles)

on:
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Scene plan file"
        default: "scene_plan_part1.json"
      voice_mode:
        description: "with_voice = Hindi narration + subtitles. silent_with_subtitles = no voice"
        type: choice
        default: with_voice
        options:
          - with_voice
          - silent_with_subtitles
      voice_gender:
        description: "Narrator voice (only used with_voice)"
        type: choice
        default: male
        options:
          - male
          - female
      tts_engine:
        description: "Voice engine (auto = Edge first, then Gemini if you added the key)"
        type: choice
        default: auto
        options:
          - auto
          - edge
          - gemini
      rate:
        description: "Speaking speed for the Edge voice (example: -8% slower, +0% normal)"
        default: "-8%"
      fps:
        description: "Frames per second to render"
        default: "12"
      engine:
        description: "Render engine"
        type: choice
        default: EEVEE
        options:
          - EEVEE
          - CYCLES

jobs:
  movie:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Download asset packs from the Release (tag "assets")
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p asset_zips assets
          gh release download assets --repo "$GITHUB_REPOSITORY" --dir asset_zips \
            || echo "No release with the tag 'assets' found."
          for z in asset_zips/*.zip; do
            [ -f "$z" ] || continue
            d="assets/$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -q -o "$z" -d "$d"
            echo "Unpacked $z"
          done
          for f in asset_zips/*.gltf asset_zips/*.glb; do
            [ -f "$f" ] || continue
            mkdir -p assets/loose_models
            cp "$f" assets/loose_models/
          done

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xz-utils unzip fonts-noto-core \
            libxi6 libxrender1 libxkbcommon0 libsm6 libxxf86vm1 \
            libxfixes3 libgl1 libegl1 libgl1-mesa-dri
          pip install edge-tts
          fc-cache -f
          echo "Devanagari fonts found:"
          fc-list | grep -i "devanagari" | head -3 || echo "NO Devanagari font found"

      - name: Make the Hindi narration
        env:
          PLAN_FILE: ${{ inputs.plan_file }}
          GENDER: ${{ inputs.voice_gender }}
          ENGINE: ${{ inputs.tts_engine }}
          RATE: ${{ inputs.rate }}
          VOICE_MODE: ${{ inputs.voice_mode }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXTRA="--on-fail silent"
          if [ "$VOICE_MODE" = "silent_with_subtitles" ]; then EXTRA="--no-audio"; fi
          python3 tts.py --plan "$PLAN_FILE" --gender "$GENDER" --engine "$ENGINE" --rate="$RATE" $EXTRA

      - name: Download Blender 3.6 LTS
        run: |
          mkdir -p "$HOME/blender"
          curl -L -o blender.tar.xz https://download.blender.org/release/Blender3.6/blender-3.6.5-linux-x64.tar.xz
          tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1
          "$HOME/blender/blender" -b --version

      - name: Quick check of every shot (one picture each, a few minutes)
        env:
          VID_FPS: ${{ inputs.fps }}
          VID_ENGINE: ${{ inputs.engine }}
        run: |
          mkdir -p preflight
          xvfb-run -a "$HOME/blender/blender" -b --python-exit-code 1 \
            -P movie_render.py -- \
            --assets . --plan scene_plan_timed.json --fps "$VID_FPS" \
            --engine "$VID_ENGINE" --out preflight --sample-only

      - name: Render all shots
        env:
          VID_FPS: ${{ inputs.fps }}
          VID_ENGINE: ${{ inputs.engine }}
        run: |
          mkdir -p out
          xvfb-run -a "$HOME/blender/blender" -b --python-exit-code 1 \
            -P movie_render.py -- \
            --assets . --plan scene_plan_timed.json --fps "$VID_FPS" \
            --engine "$VID_ENGINE" --out out

      - name: Build the final video
        env:
          VID_FPS: ${{ inputs.fps }}
        run: |
          MUSIC=""
          MUSIC_FILE=$(find music assets -type f -iname "music*.mp3" 2>/dev/null | head -1 || true)
          if [ -n "$MUSIC_FILE" ]; then MUSIC="$MUSIC_FILE"; echo "Using music: $MUSIC"; fi
          python3 assemble.py --plan scene_plan_timed.json --frames out --fps "$VID_FPS" \
            --out out/movie_final.mp4 --music "$MUSIC"
          rm -f out/frame_*.png

      - name: Show result summary
        if: always()
        run: |
          if [ -f tts_summary.md ]; then cat tts_summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f preflight/summary.md ]; then echo "### Quick check notes" >> "$GITHUB_STEP_SUMMARY"; cat preflight/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-final
          path: |
            out/movie_final.mp4
            preflight/sample_shot*.png
            out/subs.ass
            out/summary.md
            tts_summary.md
            narration_preview.mp3
            scene_plan_timed.json
