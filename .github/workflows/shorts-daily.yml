name: Shorts - daily (Gemini director, then voice and render)

on:
  schedule:
    - cron: "30 2 * * *"        # 08:00 India time, every day
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: your own story idea (empty = the next idea from animal_studio.json)"
        default: ""
      story_mode:
        description: "money = money awareness told with animals, adventure = pure animal adventure, config = use animal_studio.json"
        type: choice
        default: config
        options: [config, money, adventure]
      language:
        description: "Narration language"
        type: choice
        default: English
        options: [English, Hindi]
      voice_gender:
        description: "Narrator"
        type: choice
        default: female
        options: [male, female]
      quality:
        description: "Render quality"
        type: choice
        default: high
        options: [high, ultra, balanced, fast]
      upload_youtube:
        description: "yes = upload the finished Short to YouTube automatically when it is ready"
        type: choice
        default: "yes"
        options: ["yes", "no"]
      youtube_privacy:
        description: "private = only you see it, check it in YouTube Studio and press Publish (recommended). unlisted / public = visible at once"
        type: choice
        default: private
        options: [private, unlisted, public]
      only_plan:
        description: "Only write the story and plan, do not render (for testing)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: shorts-daily
  cancel-in-progress: false

jobs:
  director:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Check the director is the right file
        run: |
          check() { grep -q "$2" "$1" || { echo "ERROR: $1 is not the right file (it does not contain: $2). Copy the new $1 from Claude into the repo root, replacing the old one."; exit 1; }; }
          nocheck() { grep -q "$2" "$1" && { echo "ERROR: $1 contains the wrong code ($2). A different script was pasted into this file. Copy the right one."; exit 1; }; return 0; }
          check story_director.py "def build_story_prompt"
          check story_director.py "def pick_episode"
          check story_director.py "class QuotaOut"
          check animal_studio.json '"season"'
          nocheck story_director.py "import bpy"
          check shorts_core.py "def cut_camera"

      - name: Gemini writes and directs today's story (with retry)
        id: plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language || 'English' }}
          STORY_MODE: ${{ inputs.story_mode || 'config' }}
        run: |
          ARGS=(--language "$LANGUAGE")
          [ "$STORY_MODE" != "config" ] && ARGS+=(--story-mode "$STORY_MODE")
          [ -n "$TOPIC" ] && ARGS+=(--topic "$TOPIC")
          ok=0
          for i in 1 2 3; do
            if python3 story_director.py "${ARGS[@]}"; then
              ok=1; break
            else
              code=$?
            fi
            if [ "$code" = 75 ]; then
              echo "The Gemini daily quota is used up. Nothing more can be done today. Run this workflow again after the quota resets, or switch on billing for the Gemini key."
              echo "### Gemini daily quota used up. Run again later." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "Director attempt $i failed (code $code), waiting 90 s"; sleep 90
          done
          [ "$ok" = 1 ] || { echo "No story was made"; exit 1; }

      - name: Show the story and direction
        if: always()
        run: |
          [ -f director_report.md ] && cat director_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save the plan in the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add plans studio_progress.json
          git commit -m "Daily plan ${{ steps.plan.outputs.plan_file }}" || echo "Nothing to commit"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push && break
            sleep 10
          done

      - name: Start voice and render
        if: ${{ inputs.only_plan != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ steps.plan.outputs.plan_file }}
          GENDER: ${{ inputs.voice_gender || 'male' }}
          QUALITY: ${{ inputs.quality || 'high' }}
          UPLOAD: ${{ inputs.upload_youtube || 'yes' }}
          PRIVACY: ${{ inputs.youtube_privacy || 'private' }}
        run: |
          gh workflow run shorts-render.yml --ref "${{ github.ref_name }}" \
            -f plan_file="$PLAN" -f voice_gender="$GENDER" -f quality="$QUALITY" \
            -f upload_youtube="$UPLOAD" -f youtube_privacy="$PRIVACY"
          echo "Render started for $PLAN. Follow it in Actions; the Short is the artifact shorts-final." >> "$GITHUB_STEP_SUMMARY"
