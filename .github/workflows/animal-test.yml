name: Animal render test

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Animal file name without extension (example: Horse)"
        default: "Horse"
      action_keyword:
        description: "Animation name or part of it (example: Walk, Gallop, Idle)"
        default: "Walk"
      rotate_z:
        description: "Turn the animal (try 90 first; if it walks wrong, try 270, 0 or 180)"
        type: choice
        default: "90"
        options:
          - "90"
          - "270"
          - "0"
          - "180"
      seconds:
        description: "Video length in seconds"
        default: "30"
      fps:
        description: "Frames per second"
        default: "12"
      engine:
        description: "Render engine"
        type: choice
        default: EEVEE
        options:
          - EEVEE
          - CYCLES
      sample_only:
        description: "Only render 6 sample frames and estimate the total time"
        type: boolean
        default: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: List uploaded model files
        run: |
          echo "Model files found in the repository:"
          find . -type f \( -iname "*.glb" -o -iname "*.gltf" \) -not -path "./.git/*" | sort | head -200

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg xz-utils \
            libxi6 libxrender1 libxkbcommon0 libsm6 libxxf86vm1 \
            libxfixes3 libgl1 libegl1 libgl1-mesa-dri

      - name: Download Blender 3.6 LTS
        run: |
          mkdir -p "$HOME/blender"
          curl -L -o blender.tar.xz https://download.blender.org/release/Blender3.6/blender-3.6.5-linux-x64.tar.xz
          tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1
          "$HOME/blender/blender" -b --version

      - name: Render
        env:
          MODEL_NAME: ${{ inputs.model_name }}
          ACTION_KEYWORD: ${{ inputs.action_keyword }}
          ROTATE_Z: ${{ inputs.rotate_z }}
          VID_SECONDS: ${{ inputs.seconds }}
          VID_FPS: ${{ inputs.fps }}
          VID_ENGINE: ${{ inputs.engine }}
          SAMPLE_ONLY: ${{ inputs.sample_only }}
        run: |
          mkdir -p out
          EXTRA=""
          if [ "$SAMPLE_ONLY" = "true" ]; then EXTRA="--sample-only"; fi
          xvfb-run -a "$HOME/blender/blender" -b --python-exit-code 1 \
            -P animal_test.py -- \
            --assets . --model "$MODEL_NAME" --action "$ACTION_KEYWORD" \
            --rotate-z "$ROTATE_Z" \
            --seconds "$VID_SECONDS" --fps "$VID_FPS" \
            --engine "$VID_ENGINE" --out out $EXTRA

      - name: Build MP4 (full render only)
        if: ${{ inputs.sample_only == false }}
        env:
          VID_FPS: ${{ inputs.fps }}
        run: |
          ffmpeg -y -framerate "$VID_FPS" -i out/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -crf 20 out/demo.mp4
          rm -f out/frame_*.png

      - name: Show result summary
        if: always()
        run: |
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animal-test-results
          path: |
            out/summary.md
            out/timing.json
            out/sample_*.png
            out/demo.mp4
