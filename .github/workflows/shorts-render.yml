name: Shorts - make the video from a plan (voice, 6 parallel renders, final)

on:
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Plan file, e.g. plans/episode_2026-11-06.json (empty = the newest plan)"
        default: ""
      voice_gender:
        description: "Narrator"
        type: choice
        default: male
        options: [male, female]
      quality:
        description: "high = 720x1280, 32 samples. ultra = 1080x1920. balanced/fast = quicker"
        type: choice
        default: high
        options: [high, ultra, balanced, fast]
      fps:
        description: "Animation frames per second. 12 = good and fast (the final video is 30 fps anyway). 15 = smoother, 25% slower"
        default: "12"
      shards:
        description: "How many render jobs run in parallel (more = the video is ready sooner; 12 is a good start, up to 20 on a free plan)"
        default: "12"
      voice_name:
        description: "Optional Gemini voice name for the single narrator (empty = Achird for male, Sulafat for female). Others to try: Puck, Leda, Zephyr, Charon, Kore"
        default: ""
      sound_design:
        description: "yes = add music, ambience and sound effects made locally (free)"
        type: choice
        default: "yes"
        options: ["yes", "no"]
      voice_engine:
        description: "auto = Gemini first, then Microsoft voices if Gemini cannot finish (recommended). gemini / azure / edge = only that one"
        type: choice
        default: auto
        options: [auto, gemini, azure, edge]
      scene_density:
        description: "How full the background is (1.6 = rich, 1.0 = lighter and faster)"
        default: "1.6"
      forward_offset:
        description: "Only if animals face the wrong way in the preview: degrees to add (try 180, 90 or -90)"
        default: "0"

jobs:
  # ------------------------------------------------------------ 1) voice and the timeline (length follows the voice)
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      count: ${{ steps.shards.outputs.count }}
    steps:
      - uses: actions/checkout@v6

      - name: Choose the plan
        id: plan
        env:
          PLAN_IN: ${{ inputs.plan_file }}
        run: |
          PLAN="$PLAN_IN"
          [ -z "$PLAN" ] && PLAN=$(ls plans/episode_*.json 2>/dev/null | sort | tail -1)
          if [ -z "$PLAN" ] || [ ! -f "$PLAN" ]; then
            echo "ERROR: no plan file found. Run the Daily workflow first, or type a plan file name."; exit 1
          fi
          echo "Using plan: $PLAN"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"

      - name: List the render parts
        id: shards
        env:
          N_IN: ${{ inputs.shards }}
        run: |
          N=$(( ${N_IN:-12} ))
          [ "$N" -lt 1 ] && N=1
          [ "$N" -gt 20 ] && N=20
          LIST=$(python3 -c "import json;print(json.dumps(list(range($N))))")
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "Render parts: $N"

      - name: Install ffmpeg (with retry)
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y ffmpeg && break
            echo "apt failed, attempt $i"; sleep $((i*10))
          done

      - name: Check the scripts are the new ones
        run: |
          for f in voice_maker.py shorts_core.py shorts_render.py shorts_assemble.py sound_design.py get_blender_v2.sh; do
            [ -f "$f" ] || { echo "ERROR: $f is missing from the repo root."; exit 1; }
          done
          check() { grep -q "$2" "$1" || { echo "ERROR: $1 is not the right file (it does not contain: $2). Copy the new $1 from Claude into the repo root, replacing the old one."; exit 1; }; }
          nocheck() { grep -q "$2" "$1" && { echo "ERROR: $1 contains the wrong code ($2). A different script was pasted into this file. Copy the right one."; exit 1; }; return 0; }
          check shorts_render.py "import bpy"
          check shorts_render.py "def clear_sightlines"
          nocheck shorts_render.py "def build_prompt"
          check shorts_core.py "def cut_camera"
          nocheck shorts_core.py "import bpy"
          check voice_maker.py "def voice_single"
          check sound_design.py "def ambience"
          check shorts_assemble.py "sidechaincompress"

      - name: Install the Microsoft voice helper (with retry)
        run: |
          for i in 1 2 3; do
            pip install --upgrade edge-tts && break
            echo "pip failed, attempt $i"; sleep $((i*10))
          done

      - name: Restore voice clips finished in earlier runs of this plan
        uses: actions/cache/restore@v5
        with:
          path: audio
          key: voice-${{ hashFiles(steps.plan.outputs.plan) }}-${{ github.run_id }}
          restore-keys: |
            voice-${{ hashFiles(steps.plan.outputs.plan) }}-

      - name: Make the narration and the timeline (finished shots are kept, also for the next run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLAN: ${{ steps.plan.outputs.plan }}
          GENDER: ${{ inputs.voice_gender }}
          FPS: ${{ inputs.fps }}
          QUALITY: ${{ inputs.quality }}
          VOICE_NAME: ${{ inputs.voice_name }}
          ENGINE: ${{ inputs.voice_engine }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          VN=(); [ -n "$VOICE_NAME" ] && VN=(--voice "$VOICE_NAME")
          ok=0
          for i in 1 2 3; do
            if python3 voice_maker.py --plan "$PLAN" --gender "$GENDER" --fps "$FPS" --quality "$QUALITY" --layout single --engine "${ENGINE:-auto}" "${VN[@]}"; then
              ok=1; break
            else
              code=$?
            fi
            if [ "$code" = 75 ]; then
              echo "The daily voice quota is used up. The finished shots are saved. Run this workflow again after the quota resets (or switch on billing for the Gemini key); it continues where it stopped."
              echo "### Voice quota used up. Run again later, finished shots are kept." >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            echo "Voice step failed (attempt $i, code $code). Finished shots are kept. Waiting 60 s."; sleep 60
          done
          [ "$ok" = 1 ] || exit 1

      - name: Save finished voice clips for the next run
        if: always()
        uses: actions/cache/save@v5
        with:
          path: audio
          key: voice-${{ hashFiles(steps.plan.outputs.plan) }}-${{ github.run_id }}

      - name: Show voice report
        if: always()
        run: |
          [ -f voice_report.md ] && cat voice_report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save plan and audio
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: plan
          path: |
            scene_plan_timed.json
            timeline.json
            voice_report.md
            audio/
            !audio/*.raw.wav
          if-no-files-found: warn

  # ------------------------------------------------------------ 2) six parallel renders
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: plan

      - name: Check the renderer is the right file
        run: |
          check() { grep -q "$2" "$1" || { echo "ERROR: $1 is not the right file (it does not contain: $2). Copy the new $1 from Claude into the repo root, replacing the old one."; exit 1; }; }
          nocheck() { grep -q "$2" "$1" && { echo "ERROR: $1 contains the wrong code ($2). A different script was pasted into this file. Copy the right one."; exit 1; }; return 0; }
          check shorts_render.py "import bpy"
          check shorts_render.py "def clear_sightlines"
          nocheck shorts_render.py "def build_prompt"
          check shorts_core.py "def cut_camera"
          nocheck shorts_core.py "import bpy"

      - name: Download the animal and nature packs (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p asset_zips assets
          for i in 1 2 3 4; do
            gh release download assets --repo "$GITHUB_REPOSITORY" --dir asset_zips --clobber \
              --pattern "animals*" --pattern "stylized-nature*" && break
            echo "Release download failed, attempt $i"; sleep $((i*15))
          done
          for z in asset_zips/*.zip; do
            [ -f "$z" ] || continue
            d="assets/$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -q -o "$z" -d "$d"
            echo "Unpacked $z"
          done
          if [ -z "$(ls -A assets)" ]; then
            echo "ERROR: no asset packs downloaded. The release tagged 'assets' must hold animals* and stylized-nature* zips."
            exit 1
          fi

      - name: Install system packages (with retry)
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y xvfb ffmpeg xz-utils unzip \
              libxi6 libxrender1 libxkbcommon0 libsm6 libxxf86vm1 \
              libxfixes3 libgl1 libegl1 libgl1-mesa-dri && break
            echo "apt failed, attempt $i"; sleep $((i*10))
          done

      - name: Keep Blender between runs
        uses: actions/cache@v5
        with:
          path: ~/blender
          key: blender-3.6.5-linux

      - name: Get Blender 3.6 LTS (several mirrors)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ./get_blender_v2.sh

      - name: Render this part (3 automatic attempts, finished frames are kept)
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.prepare.outputs.count }}
          MODEL_FORWARD_OFFSET: ${{ inputs.forward_offset }}
          SCENE_DENSITY: ${{ inputs.scene_density }}
        run: |
          mkdir -p out
          ok=0
          for i in 1 2 3; do
            xvfb-run -a "$HOME/blender/blender" -b --python-exit-code 1 \
              -P shorts_render.py -- \
              --timeline timeline.json --story scene_plan_timed.json \
              --assets . --out out --shard "$SHARD" --shards "$SHARDS" 2>&1 | tee "render_log_$SHARD.txt"; \
            [ "${PIPESTATUS[0]}" = 0 ] && ok=1 && break
            echo "Render attempt $i failed, trying again in 30 s"; sleep 30
          done
          [ "$ok" = 1 ] || exit 1

      - name: Pack this part into a video file
        env:
          FPS: ${{ inputs.fps }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.prepare.outputs.count }}
        run: |
          TOTAL=$(python3 -c "import json;print(json.load(open('timeline.json'))['total_frames'])")
          START=$((TOTAL * SHARD / SHARDS))
          ffmpeg -y -loglevel error -framerate "$FPS" -start_number "$START" -i out/f_%06d.png \
            -c:v libx264 -preset fast -crf 14 -pix_fmt yuv420p "out/segment_${SHARD}.mp4"
          echo "Shard $SHARD: frames from $START, total $TOTAL" > "out/render_summary_${SHARD}.md"
          grep -E "LENGTHS|SCALES|ANIMATIONS USED|ANIMATION PROBLEMS|MISSING MODELS|switched off|Finished|s per frame" "render_log_${SHARD}.txt" >> "out/render_summary_${SHARD}.md" || true
          rm -f out/f_*.png

      - name: Save this part
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: segment-${{ matrix.shard }}
          path: |
            out/segment_${{ matrix.shard }}.mp4
            out/render_summary_${{ matrix.shard }}.md

  # ------------------------------------------------------------ 3) final video, subtitle files, upload data
  assemble:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: plan

      - uses: actions/download-artifact@v7
        with:
          pattern: segment-*
          merge-multiple: true
          path: segments

      - name: Install ffmpeg (with retry)
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y ffmpeg && break
            echo "apt failed, attempt $i"; sleep $((i*10))
          done

      - name: Check all parts are present
        env:
          SHARDS: ${{ needs.prepare.outputs.count }}
        run: |
          for i in $(seq 0 $((SHARDS-1))); do
            [ -f "segments/segment_$i.mp4" ] || { echo "ERROR: part $i is missing. Re-run the failed render job, then this one."; ls -la segments; exit 1; }
          done

      - name: Join the parts, add the sounds, make the final video
        env:
          SHARDS: ${{ needs.prepare.outputs.count }}
          SOUND: ${{ inputs.sound_design }}
        run: |
          mkdir -p out
          : > list.txt
          for i in $(seq 0 $((SHARDS-1))); do echo "file '$PWD/segments/segment_$i.mp4'" >> list.txt; done
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy out/video_all.mp4
          MP3=$(find music -type f -iname "*.mp3" 2>/dev/null | head -1 || true)
          MUSIC_ARG=(--music "$MP3")
          if [ "$SOUND" != "no" ]; then
            if [ -n "$MP3" ]; then
              python3 sound_design.py --plan scene_plan_timed.json --timeline timeline.json --out out/soundtrack.wav --music-file "$MP3"
            else
              python3 sound_design.py --plan scene_plan_timed.json --timeline timeline.json --out out/soundtrack.wav
            fi
            MUSIC_ARG=(--music out/soundtrack.wav --music-level 0.45)
          fi
          python3 shorts_assemble.py --plan scene_plan_timed.json --timeline timeline.json \
            --video out/video_all.mp4 --out out/final_shorts.mp4 "${MUSIC_ARG[@]}"
          rm -f out/video_all.mp4

      - name: Show summary
        if: always()
        run: |
          [ -f voice_report.md ] && cat voice_report.md >> "$GITHUB_STEP_SUMMARY"
          for f in segments/render_summary_*.md; do
            [ -f "$f" ] || continue
            echo "### Part $(basename "$f" .md | sed 's/render_summary_//')" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Save the Short
        uses: actions/upload-artifact@v6
        with:
          name: shorts-final
          path: |
            out/final_shorts.mp4
            out/subtitles.srt
            out/subtitles.vtt
            out/youtube_meta.json
            out/thumbnail.jpg
            voice_report.md
            scene_plan_timed.json
