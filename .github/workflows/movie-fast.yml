name: Make full movie FAST (6 parallel jobs)

on:
  workflow_dispatch:
    inputs:
      plan_file:
        description: "Scene plan file"
        default: "scene_plan_part1.json"
      voice_mode:
        description: "with_voice = Hindi narration + subtitles. silent_with_subtitles = no voice"
        type: choice
        default: with_voice
        options:
          - with_voice
          - silent_with_subtitles
      voice_gender:
        description: "Narrator voice (only used with_voice)"
        type: choice
        default: male
        options:
          - male
          - female
      tts_engine:
        description: "gemini = Gemini voice (one call for the whole story). edge = Microsoft voice. auto = Edge first"
        type: choice
        default: gemini
        options:
          - gemini
          - edge
          - auto
      rate:
        description: "Speaking speed (example: -8% slower, +0% normal)"
        default: "-8%"
      fps:
        description: "Frames per second to render"
        default: "12"
      quality:
        description: "balanced = good and fast. fast = quickest. high = best look, slowest"
        type: choice
        default: high
        options:
          - high
          - balanced
          - fast

jobs:
  # ------------------------------------------------------------ 1) the Hindi voice and timing
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install tools (with retry)
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y ffmpeg && break
            echo "apt failed, attempt $i"; sleep $((i*10))
          done
          for i in 1 2 3 4; do
            pip install edge-tts && break
            echo "pip failed, attempt $i"; sleep $((i*10))
          done

      - name: Check tts.py is the new version
        run: |
          if ! grep -q -- "--calls" tts.py; then
            echo "ERROR: tts.py in the repo is the OLD version. Replace it with the new tts.py."
            exit 1
          fi
          echo "tts.py is the new single-call version"

      - name: Make the Hindi narration
        env:
          PLAN_FILE: ${{ inputs.plan_file }}
          GENDER: ${{ inputs.voice_gender }}
          ENGINE: ${{ inputs.tts_engine }}
          RATE: ${{ inputs.rate }}
          VOICE_MODE: ${{ inputs.voice_mode }}
          VID_FPS: ${{ inputs.fps }}
          QUALITY: ${{ inputs.quality }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXTRA="--on-fail stop"
          if [ "$VOICE_MODE" = "silent_with_subtitles" ]; then EXTRA="--no-audio"; fi
          # If the first run fails, run once more after a pause. Shots that already have
          # a voice are kept, so the second run only makes the missing ones.
          python3 tts.py --plan "$PLAN_FILE" --gender "$GENDER" --engine "$ENGINE" \
            --rate="$RATE" --fps "$VID_FPS" --quality "$QUALITY" $EXTRA \
          || { echo "Voice step failed, waiting 90 s and trying once more"; sleep 90; \
               python3 tts.py --plan "$PLAN_FILE" --gender "$GENDER" --engine "$ENGINE" \
                 --rate="$RATE" --fps "$VID_FPS" --quality "$QUALITY" $EXTRA; }

      - name: Show voice summary
        if: always()
        run: |
          [ -f tts_summary.md ] && cat tts_summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Save plan and audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: |
            scene_plan_timed.json
            timeline.json
            subs.srt
            tts_summary.md
            narration_preview.mp3
            audio/
          if-no-files-found: warn

  # ------------------------------------------------------------ 2) six jobs render different shots at the same time
  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the plan and audio
        uses: actions/download-artifact@v4
        with:
          name: plan

      - name: Download the asset packs we need from the Release (with retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p asset_zips assets
          # always: animals, men, nature. Only when the story uses a city street: buildings and cars.
          PACKS="animals* modular-men* stylized-nature*"
          if python3 -c "import json,sys; p=json.load(open('scene_plan_timed.json',encoding='utf-8')); sys.exit(0 if any(s.get('env')=='city' for s in p['shots']) else 1)"; then
            PACKS="$PACKS downtown-city* car-fbx*"
            echo "This story uses the city street: also downloading downtown-city and car-fbx"
          fi
          ARGS=()
          for p in $PACKS; do ARGS+=(--pattern "$p"); done
          for i in 1 2 3 4; do
            gh release download assets --repo "$GITHUB_REPOSITORY" --dir asset_zips --clobber "${ARGS[@]}" && break
            echo "Release download failed, attempt $i"; sleep $((i*15))
          done
          for z in asset_zips/*.zip; do
            [ -f "$z" ] || continue
            d="assets/$(basename "$z" .zip)"
            mkdir -p "$d"
            unzip -q -o "$z" -d "$d"
            echo "Unpacked $z"
          done
          if [ -z "$(ls -A assets)" ]; then
            echo "ERROR: no asset packs were downloaded. Check that the release tagged 'assets' exists in this repo."
            exit 1
          fi

      - name: Install system packages (with retry)
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y xvfb ffmpeg xz-utils unzip \
              libxi6 libxrender1 libxkbcommon0 libsm6 libxxf86vm1 \
              libxfixes3 libgl1 libegl1 libgl1-mesa-dri && break
            echo "apt failed, attempt $i"; sleep $((i*10))
          done

      - name: Download Blender 3.6 LTS (with retry)
        run: |
          mkdir -p "$HOME/blender"
          curl -L --retry 6 --retry-all-errors --retry-delay 10 -o blender.tar.xz \
            https://download.blender.org/release/Blender3.6/blender-3.6.5-linux-x64.tar.xz
          tar -xf blender.tar.xz -C "$HOME/blender" --strip-components=1
          "$HOME/blender/blender" -b --version

      - name: Render this part of the movie (one automatic retry)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p out
          ok=0
          for i in 1 2; do
            xvfb-run -a "$HOME/blender/blender" -b --python-exit-code 1 \
              -P movie_render.py -- \
              --timeline timeline.json --story scene_plan_timed.json \
              --assets . --out out --shard "$SHARD" --shards 6 2>&1 | tee "render_log_$SHARD.txt"; \
            [ "${PIPESTATUS[0]}" = 0 ] && ok=1 && break
            echo "Render attempt $i failed, trying again in 30 s"; sleep 30
          done
          [ "$ok" = 1 ] || exit 1

      - name: Pack this part into a small video file
        env:
          VID_FPS: ${{ inputs.fps }}
          SHARD: ${{ matrix.shard }}
        run: |
          TOTAL=$(python3 -c "import json;print(json.load(open('timeline.json'))['total_frames'])")
          START=$((TOTAL * SHARD / 6))
          ffmpeg -y -loglevel error -framerate "$VID_FPS" -start_number "$START" \
            -i out/f_%06d.png -c:v libx264 -preset fast -crf 14 -pix_fmt yuv420p \
            "out/segment_${SHARD}.mp4"
          echo "Shard $SHARD: frames from $START, total $TOTAL" > "out/render_summary_${SHARD}.md"
          grep -E "ANIMATIONS USED|ANIMATION PROBLEMS|MISSING MODELS|\[warn\]" "render_log_${SHARD}.txt" >> "out/render_summary_${SHARD}.md" || true
          rm -f out/f_*.png

      - name: Save this part
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: segment-${{ matrix.shard }}
          path: |
            out/segment_${{ matrix.shard }}.mp4
            out/render_summary_${{ matrix.shard }}.md

  # ------------------------------------------------------------ 3) join the parts, add voice, subtitles, music
  assemble:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the plan and audio
        uses: actions/download-artifact@v4
        with:
          name: plan

      - name: Get the 6 video parts
        uses: actions/download-artifact@v4
        with:
          pattern: segment-*
          merge-multiple: true
          path: segments

      - name: Install tools (with retry)
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core && break
            echo "apt failed, attempt $i"; sleep $((i*10))
          done
          fc-cache -f
          echo "Devanagari fonts found:"
          fc-list | grep -i "devanagari" | head -3 || echo "NO Devanagari font found"

      - name: Check all 6 parts and the assemble script are present
        run: |
          if [ ! -f assemble_movie.py ]; then
            echo "ERROR: assemble_movie.py not found in the repo root on this branch."
            ls -la
            exit 1
          fi
          for i in 0 1 2 3 4 5; do
            if [ ! -f "segments/segment_$i.mp4" ]; then
              echo "ERROR: segments/segment_$i.mp4 is missing. Render part $i failed. Re-run that part, or run the whole workflow again."
              ls -la segments
              exit 1
            fi
          done

      - name: Join the parts and build the final video
        env:
          VID_FPS: ${{ inputs.fps }}
        run: |
          mkdir -p out
          : > list.txt
          for i in 0 1 2 3 4 5; do
            echo "file '$PWD/segments/segment_$i.mp4'" >> list.txt
          done
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy out/video_all.mp4
          MUSIC=""
          MUSIC_FILE=$(find music -type f -iname "music*.mp3" 2>/dev/null | head -1 || true)
          if [ -n "$MUSIC_FILE" ]; then MUSIC="$MUSIC_FILE"; echo "Using music: $MUSIC"; fi
          python3 assemble_movie.py --plan scene_plan_timed.json --video out/video_all.mp4 \
            --fps "$VID_FPS" --out out/movie_final.mp4 --music "$MUSIC"
          rm -f out/video_all.mp4

      - name: Show result summary
        if: always()
        run: |
          if [ -f tts_summary.md ]; then cat tts_summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          for f in segments/render_summary_*.md; do
            [ -f "$f" ] || continue
            echo "### Part $(basename "$f" .md | sed 's/render_summary_//')" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Save the movie
        uses: actions/upload-artifact@v4
        with:
          name: movie-final
          path: |
            out/movie_final.mp4
            out/subs.ass
            tts_summary.md
            narration_preview.mp3
            scene_plan_timed.json
